      <path d="M 150 215 C 150 165, 180 150, 220 150 C 260 150, 290 165, 290 215 Z" fill="url(#avatarGrad)" opacity="0.9" />

      <circle cx="340" cy="55" r="24" fill="#526B50" opacity="0.12" />
      <path d="M 333 55 L 340 62 L 350 48" fill="none" stroke="#526B50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
